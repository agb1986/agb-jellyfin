#
# Derived from AmazonAppDev/vega-video-sample (MIT-0).
# Stripped to the components a Jellyfin client actually needs: one interactive
# component, media/audio/network/DRM privileges, and Vega Media Controls.
#
# Removed from the sample: LiveTV EPG sync source + EPG tasks, In-App Purchasing,
# Content Personalization, Content Launcher, and Account Login — along with their
# service/task components, process groups, offers, and extras.
#
schema-version = 1                          # [required] Schema version used in the manifest file. Currently, value must be 1

[package]
id = "com.amazondeveloper.agbjellyfin"      # [required] Package identifier. Must NOT be under com.amazon.* — only
                                            #            non-Amazon package IDs may be sideloaded onto a device.
title = "Jellyfin"                          # [required] string name for the app, used to display on FireTV launcher and Appstore.
version = "0.1.0"                           # [required] Version string of the app.
icon = "@image/VideoApp.png"                # [required] TODO: replace with a Jellyfin icon.

[os.version]
min = "1.2"
target = "1.2"

## ------------------------------------------------------------------------------
## The [components] section declares the application components in the package.
## A Jellyfin client needs exactly one: the main interactive component.
## ------------------------------------------------------------------------------
[components]
[[components.interactive]]
id = "com.amazondeveloper.agbjellyfin.main"     # [required] Unique component identifier
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
categories = [
    "com.amazon.category.main",                 # [required] Marks this as the main launchable component.
    "com.amazon.category.kepler.media"          # [optional] Required for media integration; referenced later in [extras].
]

launch-type = "singleton"                       # [optional] Only one running instance; new invocations reference it.

## ------------------------------------------------------------------------------
## The [processes] section describes which components run within a shared process.
## ------------------------------------------------------------------------------
[processes]
[[processes.group]]
component-ids = ["com.amazondeveloper.agbjellyfin.main"]

## ------------------------------------------------------------------------------
## The [wants] section declares OPTIONAL capabilities. Handle graceful fallbacks in
## application code if a feature in this list is unavailable on a device.
## ------------------------------------------------------------------------------
[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"           # On-screen keyboard, for login and search

[[wants.service]]
id = "com.amazon.kepler.pcon.service.main"

[[wants.service]]
id = "com.amazon.drm.key"                       # Required for DRM video playback

[[wants.service]]
id = "com.amazon.drm.crypto"                    # Required for DRM video playback

# ------------------------------------------------------------------------------
# MediaPlayer/MediaTransform
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

# ------------------------------------------------------------------------------
# Remote button events — required for D-pad navigation.
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.inputd.service"

# ------------------------------------------------------------------------------
# MediaControls
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

# ------------------------------------------------------------------------------
# Accessibility
# ------------------------------------------------------------------------------
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

# ------------------------------------------------------------------------------
# Required for GIPC SR — audio/video playback
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.gipc.uuid.*"

# ------------------------------------------------------------------------------
# Audio stream
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.audio.stream"

# ------------------------------------------------------------------------------
# Volume and other audio controls
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

# ------------------------------------------------------------------------------
# Network information — the Jellyfin server is reached over the LAN.
# ------------------------------------------------------------------------------
[[wants.service]]
id = "com.amazon.network.service"

## ------------------------------------------------------------------------------
## The [needs] section declares REQUIRED system capabilities. Used by the package
## manager and Appstore for device targeting.
## ------------------------------------------------------------------------------
[needs]
[[needs.privilege]]
id = "com.amazon.media.secureplayback"

[[needs.privilege]]
id = "com.amazon.privilege.security.file-sharing"   # Required for DRM video playback

[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

## ------------------------------------------------------------------------------
## The [offers] section declares capabilities offered to other packages.
## ------------------------------------------------------------------------------

[[needs.module]]
id = "/com.amazon.kepler.kepler_file_system_0@IKeplerFileSystem_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_netmgr_lib_2@INetmgrTurbomodule_0"

[[needs.module]]
id = "/com.amazon.kepler.lottie_3@ILottie_0"

[[needs.module]]
id = "/com.amazon.kepler.linear_gradient_2@ILinearGradient_0"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[[needs.module]]
id = "/com.amazon.kepler.device_info_2@IDeviceInfo_1"

[[needs.module]]
id = "/com.amazon.kepler.gesture_handler_4@IGestureHandler_0"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.localize_2@ILocalize_1"

[[needs.module]]
id = "/com.amazon.kepler.reanimated_4@IReanimated_0"

[[needs.module]]
id = "/com.amazon.kepler.safe_area_context_8@ISafeAreaContext_0"

[[needs.module]]
id = "/com.amazon.kepler.screens_3@IScreens_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.vector_icons_2@IVectorIcons_1"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.worklets_1@IWorklets_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__core_8@INavigation__Core_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__drawer_8@INavigation__Drawer_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__elements_8@INavigation__Elements_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__native_8@INavigation__Native_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__routers_8@INavigation__Routers_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__stack_8@INavigation__Stack_0"

[[needs.module]]
id = "/com.amazon.kepler.security_manager_lib_1@ISecurityManagerLib_0"

































[offers]
# Required for GIPC SR
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.interaction]]
id = "com.amazondeveloper.agbjellyfin.main"

[[offers.module]]
id = "/com.amazondeveloper.agbjellyfin.main@IMod1"
includes-messages = [
    "pkg://com.amazondeveloper.agbjellyfin.main"
]

## ------------------------------------------------------------------------------
## The [[message]] section defines the URIs this package introduces to the system.
## ------------------------------------------------------------------------------
[[message]]
uri = "pkg://com.amazondeveloper.agbjellyfin.main"      # [required] main component launch uri
sender-privileges = ["*"]                               # [required] anyone can launch this app
receiver-privileges = ["self"]                          # [required] only this app can receive this launch message

## ------------------------------------------------------------------------------
## The [[extras]] section describes custom configuration for Amazon integrations.
## Only Vega Media Controls is kept — it drives the transport controls the TV
## remote and system UI surface during playback.
## ------------------------------------------------------------------------------
[[extras]]
key = "interface.provider"
component-id = "com.amazondeveloper.agbjellyfin.main"

[extras.value.application]
# ------------------------------------------------------------------------------
# Vega Media Controls (VMC)
# ------------------------------------------------------------------------------
[[extras.value.application.interface]]
interface_name = "com.amazon.kepler.media.IMediaPlaybackServer"
command_options = [
    "StartOver",
    "Previous",
    "Next",
    "SkipForward",
    "SkipBackward",
]
attribute_options = ["AudioAdvanceMuted"]
features = ["AdvancedSeek", "VariableSpeed", "AudioTracks", "TextTracks"]
